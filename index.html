<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGNORDESTE ANALYTICS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="benchmark-data.js"></script>
<style>
:root{--bg:#f0f2f5;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--panel:#fff;--brand:#0d9f5e;--brand-dark:#064e30;--brand-light:#ecfdf5;--gold:#f59e0b;--bad:#ef4444;--warn:#f97316;--ok:#10b981;--blue:#3b82f6;--purple:#8b5cf6;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* Sidebar */
aside{background:#111827;color:white;padding:0;display:flex;flex-direction:column}
.brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-logo{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:18px;height:18px;fill:white}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px}
nav{display:flex;flex-direction:column;gap:1px;padding:10px 8px;flex:1}
nav button{border:0;background:transparent;color:rgba(255,255,255,.55);text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;transition:all .15s}
nav button:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
nav button.active{background:rgba(255,255,255,.1);color:white;font-weight:600}
nav button svg{width:16px;height:16px;opacity:.5;flex-shrink:0}
nav button.active svg{opacity:.9}
.nav-badge{margin-left:auto;background:var(--brand);color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.3)}
.sidebar-footer .cloud-status{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.cloud-dot{width:6px;height:6px;border-radius:50%;background:#4b5563}
.cloud-dot.online{background:#34d399}

/* Main */
main{padding:20px 24px;min-width:0;overflow-y:auto;max-height:100vh}
header{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px;align-items:center}
h1{font-size:20px;font-weight:700;margin:0;color:var(--ink)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center}
select,input[type="date"]{border:1px solid var(--line);background:white;border-radius:6px;padding:6px 8px;height:32px;font:inherit;font-size:12px;color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--brand)}
textarea{border:1px solid var(--line);background:white;border-radius:6px;padding:8px;font:inherit;font-size:12px;resize:vertical}

/* Grid */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* KPI Cards */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative}
.kpi .lb{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.kpi .vl{font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}
.kpi .delta{font-size:11px;font-weight:600;margin-top:4px}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--bad)}
.kpi-accent{border-left:3px solid var(--brand)}
.kpi-extremes{display:flex;gap:0;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:10px}
.kpi-ext{flex:1;display:flex;flex-direction:column;gap:1px}
.kpi-ext+.kpi-ext{padding-left:8px;border-left:1px solid var(--line)}
.kpi-ext .ext-lb{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:9px}
.kpi-ext .ext-loja{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.kpi-ext .ext-val{font-weight:800;color:var(--ink)}
.pivot-cat{border-collapse:collapse;width:100%;font-size:11px}
.pivot-cat th,.pivot-cat td{border:1px solid var(--line);padding:6px 8px;font-variant-numeric:tabular-nums}
.pivot-cat-th{font-weight:700;font-size:12px;text-align:left;background:#fff}
.pivot-loja-th{text-align:center;min-width:100px;font-weight:700;font-size:11px;background:var(--bg);white-space:nowrap}
.pivot-loja-sub{font-size:9px;font-weight:600;margin-top:2px}
.pivot-cat-row{cursor:pointer;user-select:none}
.pivot-cat-row:hover td{background:var(--bg)}
.pivot-cat-name{font-weight:700;font-size:11px;white-space:nowrap}
.pivot-cat-total{font-size:9px;font-weight:600;margin-top:1px}
.tree-toggle{display:inline-block;width:14px;font-size:8px;color:var(--muted)}
.pivot-cell{text-align:center;white-space:nowrap}
.pivot-val{font-weight:600;font-size:11px}
.pivot-marg{font-size:10px;font-weight:700}
.pivot-empty{color:var(--muted);font-size:10px}
.pivot-prod-row td{background:#fafafa;font-size:10px;padding:3px 8px}
.pivot-prod-name{font-weight:400;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pivot-prod-cell{font-size:9px;white-space:nowrap}
.m-good{color:#16a34a}.m-warn{color:#ca8a04}.m-bad{color:#dc2626}
.range-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.range-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.range-card .lb{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.range-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;align-items:flex-start}
.range-row+.range-row{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.range-row span{color:var(--muted);font-weight:700}
.range-row b{color:var(--ink);font-weight:800;text-align:right}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.panel-title{font-size:14px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.panel-sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-header .panel-title{margin:0}
.metric-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.metric-controls label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#475569;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;cursor:pointer;white-space:nowrap}
.metric-controls input{accent-color:var(--brand)}

/* Charts - BI SIZED */
.chart-xl{position:relative;width:100%;height:380px}
.chart-full{position:relative;width:100%;height:calc(100vh - 190px);min-height:520px}
.chart-lg{position:relative;width:100%;height:300px}
.chart-md{position:relative;width:100%;height:240px}
.chart-sm{position:relative;width:100%;height:180px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:100;display:flex;align-items:stretch;justify-content:center;padding:28px}
.modal-card{background:#fff;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.35);width:min(1500px,100%);display:flex;flex-direction:column;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}
.modal-head h3{margin:0;font-size:18px}
.modal-head .sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Tables */
.table-wrap{overflow:auto;max-height:500px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f9fafb;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.4px;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink)}
th .sa{font-size:9px;margin-left:2px;opacity:.3}
th.sorted .sa{opacity:1;color:var(--brand)}
tbody tr:nth-child(even){background:#f9fafb}
tbody tr:hover{background:#f0fdf4}
td b{font-weight:600}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.p-ok{background:#dcfce7;color:#166534}
.p-warn{background:#fef3c7;color:#92400e}
.p-bad{background:#fee2e2;color:#991b1b}
.p-info{background:#dbeafe;color:#1e40af}
.p-muted{background:#f3f4f6;color:#6b7280}

/* Buttons */
.btn{border:1px solid var(--line);background:white;border-radius:6px;padding:5px 10px;font-weight:600;cursor:pointer;font-size:11px;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#9ca3af;background:#f9fafb}
.btn svg{width:12px;height:12px}
.primary{background:var(--brand);border-color:var(--brand);color:white}
.primary:hover{background:#0b8a50}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Hero */
.hero{background:linear-gradient(135deg,#111827 0%,#1e3a2f 50%,#0d3d28 100%);color:white;border-radius:var(--radius);padding:24px;margin-bottom:16px}
.hero h2{margin:0 0 4px;font-size:18px;font-weight:700}
.hero .sub{color:rgba(255,255,255,.6);font-size:12px}
.hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.hero-kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px}
.hero-kpi .lb{color:rgba(255,255,255,.5);font-size:10px;font-weight:600;letter-spacing:.3px}
.hero-kpi .vl{font-size:18px;font-weight:800;margin-top:4px}
.hero-kpi .sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:2px}

/* Import */
.drop{border:2px dashed #d1d5db;border-radius:var(--radius);background:#fafbfc;padding:20px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.preview,pre.sql{white-space:pre;overflow:auto;max-height:360px;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:11px;font-family:'JetBrains Mono','Fira Code',monospace;line-height:1.6}

/* Utilities */
.mt{margin-top:16px}
.mt2{margin-top:24px}
.muted{color:var(--muted)}
.alert{background:white;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:12px;margin:8px 0;font-size:12px}
.alert.a-bad{border-left-color:var(--bad)}
.alert.a-warn{border-left-color:var(--warn)}
.alert.a-ok{border-left-color:var(--ok)}
.alert.a-info{border-left-color:var(--blue)}
.alert b{font-weight:700}

/* Decision cards */
.dcard{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px;margin-bottom:10px}
.dcard .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dcard h4{font-size:13px;font-weight:700;margin:0}
.dcard .desc{font-size:11px;color:var(--muted);margin-top:2px}
.bar6{height:5px;background:#f3f4f6;border-radius:99px;overflow:hidden;margin:8px 0}
.bar6 span{display:block;height:100%;border-radius:99px}
.metrics5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.mbox{background:#f9fafb;border-radius:6px;padding:6px 8px;font-size:11px}
.mbox .lb{font-size:9px;color:var(--muted);font-weight:600}
.mbox b{display:block;font-size:13px;margin-top:1px}
.verdict{font-size:12px;font-weight:700;margin-top:8px;color:var(--brand-dark)}

/* Risk */
.risk-grid{display:grid;gap:6px}
.risk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
.risk .rl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;min-width:80px}

/* Actions */
.action-list{counter-reset:act;display:grid;gap:6px}
.action-step{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;background:#fff;padding:10px 12px;font-size:12px}
.action-step:before{counter-increment:act;content:counter(act);display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:var(--brand-light);color:var(--brand);font-weight:800;font-size:11px;margin-right:8px}

/* Empresas inline edit */
.emp-input{width:100%;min-width:220px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font:inherit;font-size:12px;color:var(--ink)}
.emp-input:hover{border-color:var(--line);background:#fff}
.emp-input:focus{border-color:var(--brand);background:#fff;outline:none}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:white;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Fade */
#view{transition:opacity .15s ease}
#view.fade{opacity:0}

/* Print */
@media print{
  aside,.filters,.btn,nav,header .filters{display:none!important}
  .app{display:block!important}
  main{padding:10px!important;max-height:none!important;overflow:visible!important}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kpi,.panel{box-shadow:none!important;break-inside:avoid}
  .print-header{display:block!important}
  body{font-size:10px}
}
.print-header{display:none}

/* Responsive */
@media(max-width:980px){
  .app{grid-template-columns:1fr}
  aside{display:block;position:sticky;top:0;z-index:20}
  aside .brand,.sidebar-footer{display:none}
  nav{flex-direction:row;overflow:auto;padding:8px;background:#111827}
  nav button{white-space:nowrap;flex:0 0 auto}
  header{flex-direction:column;align-items:stretch}
  .kpis,.g2,.g3,.g4,.row,.hero-kpis,.metrics5{grid-template-columns:1fr}
  .filters{justify-content:flex-start}
}
.bench-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}.bench-tabs button{border:0;background:transparent;color:var(--muted);padding:9px 13px;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}.bench-tabs button.active{color:var(--green);border-bottom-color:var(--green)}
.bench-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bench-flyer{display:grid;grid-template-columns:190px 1fr;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:260px}.bench-flyer>img{width:100%;height:100%;object-fit:cover;object-position:top;background:#111}.bench-flyer-body{padding:16px;min-width:0}.bench-flyer h3{font-size:17px;margin-top:3px}.bench-filterbar{display:grid;grid-template-columns:1.3fr 1.3fr 1fr 1fr auto auto;gap:8px;align-items:end;background:#fff;border:1px solid var(--line);padding:12px;border-radius:8px}.bench-filterbar label,.form-grid label,.field-wide{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}.bench-filterbar .check{flex-direction:row;align-items:center;padding-bottom:9px;white-space:nowrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field-wide{margin-top:9px}.bench-review{max-height:620px}.bench-review input,.bench-review select{min-width:76px;padding:6px;font-size:11px}.bench-review td:nth-child(4) input,.bench-review td:nth-child(5) input{min-width:170px}.bench-review td:nth-child(3) input{min-width:120px}.insight-panel{border-left:3px solid var(--green)}.insight-panel>p{font-size:13px;line-height:1.65;margin-top:10px;color:var(--text)}
@media(max-width:1100px){.bench-list{grid-template-columns:1fr}.bench-filterbar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.bench-flyer{grid-template-columns:1fr}.bench-flyer>img{height:220px}.form-grid,.bench-filterbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="print-header"><h1>BIGNORDESTE ANALYTICS</h1><p id="printDate"></p></div>
<div class="toast" id="toast"></div>
<div class="app">
<aside>
  <div class="brand"><div class="brand-logo"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></div><div><b>BIGNORDESTE</b><span>analytics</span></div></div></div>
  <nav id="nav"></nav>
  <div class="sidebar-footer"><div class="cloud-status"><span class="cloud-dot" id="cloudDot"></span> <span id="cloudLabel">Offline</span></div><div>v2.0</div></div>
</aside>
<main>
  <header>
    <div><h1 id="title"></h1><div id="sub" class="sub"></div></div>
    <div class="filters">
      <select id="fLoja"></select>
      <select id="fRegiao"></select>
      <input id="fInicio" type="date" value="2026-01-01">
      <input id="fFim" type="date" value="2026-07-01">
      <button id="fReset" class="btn" onclick="resetFilters()" title="Limpar filtros de data" style="padding:4px 8px;font-size:11px">&#x21bb;</button>
      <select id="fVisao"><option value="acumulado">Acumulado</option><option value="mensal">Mensal</option></select>
      <select id="fCamp"></select>
    </div>
  </header>
  <section id="view"></section>
</main>
</div>
<script>
/* ===== CHART PALETTE ===== */
const PAL={green:'#0d9f5e',greenLight:'rgba(13,159,94,.12)',gold:'#f59e0b',goldLight:'rgba(245,158,11,.12)',blue:'#3b82f6',blueLight:'rgba(59,130,246,.12)',red:'#ef4444',redLight:'rgba(239,68,68,.12)',purple:'#8b5cf6',purpleLight:'rgba(139,92,246,.12)',teal:'#14b8a6',gray:'#6b7280',dark:'#111827'};
const COLORS=[PAL.green,PAL.gold,PAL.blue,PAL.red,PAL.purple,PAL.teal];
const BG_COLORS=[PAL.greenLight,PAL.goldLight,PAL.blueLight,PAL.redLight,PAL.purpleLight,'rgba(20,184,166,.12)'];
const SOLID_COLORS=['#059669','#d97706','#2563eb','#dc2626','#7c3aed','#0d9488'];

/* ===== FORMATTERS ===== */
const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}),STORE_KEY='bignordeste.analytics.periodo.v1',MONTH_METRICS_KEY='bignordeste.analytics.monthMetrics.v1';
const brl=v=>money.format(+v||0),num=v=>nf.format(+v||0),pct=v=>num(v)+'%';
function brlShort(v){v=+v||0;if(Math.abs(v)>=1e6)return'R$ '+num(v/1e6)+'M';if(Math.abs(v)>=1e3)return'R$ '+num(v/1e3)+'K';return brl(v)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const API_TOKEN=localStorage.getItem('bignordeste.api_token')||'';
function authHeaders(json){let h={};if(json)h['Content-Type']='application/json';if(API_TOKEN)h['Authorization']='Bearer '+API_TOKEN;return h}
function setApiToken(t){localStorage.setItem('bignordeste.api_token',t||'');location.reload()}
function readMonthMetrics(){try{return JSON.parse(localStorage.getItem(MONTH_METRICS_KEY)||'null')||['vt','venda','lucro','margem','pen','produtos']}catch(e){return['vt','venda','lucro','margem','pen','produtos']}}
let monthMetrics=readMonthMetrics();
function toggleMonthMetric(k){monthMetrics=monthMetrics.includes(k)?monthMetrics.filter(x=>x!=k):[...monthMetrics,k];if(!monthMetrics.length)monthMetrics=['venda'];try{localStorage.setItem(MONTH_METRICS_KEY,JSON.stringify(monthMetrics))}catch(e){}render()}

let sortState={};
function cellNum(v){let s=String(v).replace(/<[^>]*>/g,'');let mult=/\dM\b/.test(s)?1e6:/\dK\b/.test(s)?1e3:1;s=s.replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return(parseFloat(s)||0)*mult}
function sortableTable(tid,headers,rows,types){let s=sortState[tid]||{col:-1,asc:true};if(s.col>=0){let t=types?types[s.col]:'text';rows=[...rows].sort((a,b)=>{let va=a[s.col],vb=b[s.col];if(t==='num'){va=cellNum(va);vb=cellNum(vb)}else{va=String(va).replace(/<[^>]*>/g,'');vb=String(vb).replace(/<[^>]*>/g,'')}if(va<vb)return s.asc?-1:1;if(va>vb)return s.asc?1:-1;return 0})}let ths=headers.map((h,i)=>{let ar=s.col===i?(s.asc?'&#9650;':'&#9660;'):'&#8597;';return`<th class="${s.col===i?'sorted':''}" onclick="doSort('${tid}',${i})">${h} <span class="sa">${ar}</span></th>`}).join('');return`<div class="table-wrap"><table><thead><tr>${ths}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
function doSort(tid,col){let s=sortState[tid]||{col:-1,asc:true};if(s.col===col)s.asc=!s.asc;else{s.col=col;s.asc=true}sortState[tid]=s;render()}

function productCategory(desc){
  if(!desc)return'OUTROS';
  let u=String(desc).toUpperCase();
  for(let[re,cat]of _CAT_RULES)if(re.test(u))return cat;
  return'OUTROS';
}

let _treeOpen={};
function toggleTree(key){_treeOpen[key]=!_treeOpen[key];render()}
function classifyCategory(r){
  if(r.descricao_departamento)return r.descricao_departamento;
  return productCategory(r.descricao_produto);
}
function margemItemTree(){
  let rows=scopeRows('produtos').filter(r=>passaBloco(r.campanha));
  if(!rows.length)return'';

  rows.forEach(r=>{
    let loja=r.loja||'Sem loja',cat=classifyCategory(r);
    lojaSet.add(loja);catSet.add(cat);
    let k=cat+'||'+loja;
    if(!pivot[k])pivot[k]={v:0,l:0,prods:{}};
    pivot[k].v+=+r.venda||0;pivot[k].l+=+r.lucro||0;
    let prod=agruparVariantes?productBaseKey(r.descricao_produto):r.descricao_produto||'?';
    if(!pivot[k].prods[prod])pivot[k].prods[prod]={v:0,l:0};
    pivot[k].prods[prod].v+=+r.venda||0;pivot[k].prods[prod].l+=+r.lucro||0;
    if(!lojaTotals[loja])lojaTotals[loja]={v:0,l:0};
    lojaTotals[loja].v+=+r.venda||0;lojaTotals[loja].l+=+r.lucro||0;
  });
  let lojas=Array.from(lojaSet).sort((a,b)=>(lojaTotals[b]?.v||0)-(lojaTotals[a]?.v||0));
  if(fLoja.value!='Todas')lojas=lojas.filter(l=>l==fLoja.value);
  let catTotals={};
  Array.from(catSet).forEach(c=>{catTotals[c]={v:0,l:0};lojas.forEach(lj=>{let d=pivot[c+'||'+lj];if(d){catTotals[c].v+=d.v;catTotals[c].l+=d.l}})});
  let cats=Array.from(catSet).sort((a,b)=>catTotals[b].v-catTotals[a].v);
  let shortN=l=>l.replace(/^.*-\s*/,'');
  let h='<div class="table-wrap" style="max-height:700px;overflow:auto"><table class="pivot-cat"><thead><tr><th class="pivot-cat-th" style="min-width:130px;position:sticky;left:0;z-index:2;background:#fff">Categoria</th>';

    let lt=lojaTotals[lj],lm=lt.v?lt.l/lt.v*100:0;
    h+='<th class="pivot-loja-th" title="'+esc(lj)+'"><div>'+esc(shortN(lj))+'</div><div class="pivot-loja-sub">'+brlShort(lt.v)+' <span class="'+mc(lm)+'">'+pct(lm)+'</span></div></th>';
  });

    h+='<tr class="pivot-cat-row" onclick="toggleTree(\''+ck+'\')"><td class="pivot-cat-name" style="position:sticky;left:0;z-index:1;background:#fff"><span class="tree-toggle">'+(cOpen?'▼':'▶')+'</span>'+esc(cat)+'<div class="pivot-cat-total">'+brlShort(ct.v)+' <span class="'+mc(cm)+'">'+pct(cm)+'</span></div></td>';
    lojas.forEach(lj=>{
      let d=pivot[cat+'||'+lj];
      if(!d)h+='<td class="pivot-cell pivot-empty">-</td>';
      else{let m=d.v?d.l/d.v*100:0;h+='<td class="pivot-cell"><div class="pivot-val">'+brlShort(d.v)+'</div><div class="pivot-marg '+mc(m)+'">'+pct(m)+'</div></td>'}
    });
    h+='</tr>';
    if(cOpen){
      let allProds={};
      lojas.forEach(lj=>{let d=pivot[cat+'||'+lj];if(d)Object.entries(d.prods).forEach(([p,pv])=>{if(!allProds[p])allProds[p]={total:0,lojas:{}};allProds[p].total+=pv.v;allProds[p].lojas[lj]=pv})});
      let prodList=Object.entries(allProds).sort((a,b)=>b[1].total-a[1].total);

        h+='<tr class="pivot-prod-row"><td class="pivot-prod-name" style="position:sticky;left:0;z-index:1;background:#fafafa" title="'+esc(prod)+'">'+esc(prod)+'</td>';

}
function exportMargemTree(){
  let rows=scopeRows('produtos').filter(r=>passaBloco(r.campanha)),out=[];
  let groups={};
  rows.forEach(r=>{
    let dept=classifyCategory(r),prod=agruparVariantes?productBaseKey(r.descricao_produto):r.descricao_produto;
    let k=r.loja+'|'+dept+'|'+prod;
    if(!groups[k])groups[k]={loja:r.loja,dept,prod,v:0,l:0,q:0};
    groups[k].v+=+r.venda||0;groups[k].l+=+r.lucro||0;groups[k].q+=+r.quantidade||0;
  });
  Object.values(groups).sort((a,b)=>a.loja.localeCompare(b.loja)||a.dept.localeCompare(b.dept)||b.v-a.v).forEach(g=>{
    out.push([g.loja,g.dept,g.prod,g.v.toFixed(2),g.l.toFixed(2),(g.v?g.l/g.v*100:0).toFixed(2),g.q]);
  });
  exportCSV('margem_item_ofertado.csv',['Loja','Categoria','Produto','Venda','Lucro','Margem','Quantidade'],out);
}

html+=`<div class="panel mt"><div class="panel-title">Campanhas ativas por dia</div><div class="panel-sub">Cruzamento loja + data entre oferta diaria e venda diaria da loja${rows.length>300?' — mostrando as 300 primeiras de '+num(rows.length)+' linhas':''}</div>${sortableTable('tDaily',['Data','Bloco','Campanha','Venda oferta','Venda total dia','Part. dia','Lucro','Margem','Pen. dia'],rows.slice(0,300).map(r=>[r.data,esc(r.bloco),esc(r.campanha),brl(r.venda),brl(r.venda_total_dia),pct(r.participacao_dia),brl(r.lucro),pct(r.margem),pct(r.penetracao_dia)]),['text','text','text','num','num','num','num','num','num'])}</div>`;
html+=`<div class="panel mt"><div class="panel-title">Ciclos de campanha</div><div class="panel-sub">Dias consecutivos da mesma campanha por loja</div>${sortableTable('tCycles',['Loja','Bloco','Campanha','Inicio','Fim','Dias','Venda','Venda total periodo','Part. periodo','Lucro','Margem','Venda/dia','Lucro/dia'],cycles.map(r=>[esc(r.loja||''),esc(r.bloco),esc(r.campanha),r.inicio,r.fim,r.dias,brl(r.venda),brl(r.vendaTotal),pct(r.partPeriodo),brl(r.lucro),pct(r.margem),brl(r.vendaDia),brl(r.lucroDia)]),['text','text','text','text','text','num','num','num','num','num','num','num','num'])}</div>`;return html}

function history(){return db.importacoes.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Arquivo</th><th>Loja</th><th>Tipo</th><th>Linhas</th><th>Ign.</th><th>Obs.</th></tr></thead><tbody>${db.importacoes.map(i=>`<tr><td>${esc(i.data)}</td><td>${esc(i.arquivo)}</td><td>${esc(i.loja)}</td><td>${esc(TYPES[i.tipo]?.label||i.tipo)}</td><td>${i.linhas||0}</td><td>${i.ignoradas||0}</td><td>${esc(i.observacao||'-')}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted" style="text-align:center;padding:24px">Nenhuma importacao registrada.</p>`}
function showReq(){if(window.req)req.innerHTML='Colunas: '+TYPES[it.value].cols.join(', ')}
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'_')}
function parseNum(v){if(v==null||String(v).trim()==='')return'';let s=String(v).trim();if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');let n=Number(s);return Number.isFinite(n)?n:v}
function monthKey(v){let s=String(v??'').trim();if(!s)return'';let m=s.match(/^(\d{4})[-\/](\d{1,2})(?:[-\/]\d{1,2})?$/);if(m)return m[1]+'-'+m[2].padStart(2,'0');m=s.match(/^(\d{1,2})[-\/](\d{4})$/);if(m)return m[2]+'-'+m[1].padStart(2,'0');m=s.match(/^\d{1,2}[-\/](\d{1,2})[-\/](\d{4})$/);if(m)return m[2]+'-'+m[1].padStart(2,'0');return s.slice(0,7)}
function dateKey(v){let s=String(v??'').trim();if(!s)return'';let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s.slice(0,10)}
function inDatePeriod(d,ini,fim){let x=dateKey(d);return x&&x>=ini&&x<=fim}
async function readText(f){let b=await f.arrayBuffer(),t=new TextDecoder('utf-8').decode(b);if(t.includes('\uFFFD'))t=new TextDecoder('iso-8859-1').decode(b);return t.replace(/^\uFEFF/,'')}
const TEXT_COLS=new Set(['loja','id_tipooferta','id_produto','mercadologico1','codigo','id_vr','campanha','descricao','descricao_produto','descricao_departamento']);
function parseTxt(text){let lines=text.split(/\r?\n/).filter(x=>x.trim()),head=lines[0].split(';').map(norm);let rows=lines.slice(1).map(line=>{let cells=line.split(';');return Object.fromEntries(head.map((h,i)=>[h,TEXT_COLS.has(h)?(cells[i]??'').trim():parseNum(cells[i]??'')]))});return{head,rows,preview:lines.slice(0,8).join('\n')}}
function detectType(name,fb,head=[]){let n=name.toLowerCase();if(n.includes('venda_dia_campanha')||n.includes('ofertas_dia_campanha'))return'ofertas_dia_campanha';if(n.includes('venda_diario')||n.includes('venda_diaria')||n.includes('venda_diaria_loja'))return'venda_diaria_loja';if(n.includes('resumo_geral'))return'resumo_geral_loja';if(n.includes('campanhas_ofertas')||n.includes('campanha_ofertas')||n.includes('campanha_oferta'))return'campanhas_ofertas';if(n.includes('produtos_campanha')||n.includes('produto_campanha')||n.includes('produtos_loja')||n.includes('produto_loja'))return'produtos_campanha';if(n.includes('departamento'))return'departamentos_campanha';if(n.includes('cupons'))return'cupons_totais';let has=c=>head.includes(c);if(has('venda_oferta')&&has('cupons_oferta')&&has('data'))return'ofertas_dia_campanha';if(has('venda_total')&&has('cupons_totais')&&has('data')&&!has('mes'))return'venda_diaria_loja';if(has('venda_total')&&has('cupons_totais'))return'resumo_geral_loja';if(has('descricao_departamento')&&has('mercadologico1'))return'departamentos_campanha';if(has('id_produto')&&has('descricao_produto')&&has('campanha'))return'produtos_campanha';if(has('cupons_campanha')&&has('cupons_totais'))return'cupons_totais';if(has('id_tipooferta')&&has('descricao')&&has('ticket_medio'))return'campanhas_ofertas';return fb}
async function processImport(){
  let btn=document.getElementById('importBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .5s linear infinite;margin-right:6px"></span>Importando...'}
  let sel=[...((window.files&&files.files)||[]),...((window.folderFiles&&folderFiles.files)||[])],fs=sel.filter(f=>f.name.toLowerCase().endsWith('.txt')),loja=il.value,ini=ii.value,fim=ifim.value,tipo=(window.it&&it.value)||'resumo_geral_loja',obs=io.value.trim()||'Sem observacao';
  let box=document.getElementById('ir');
  function done(){let b=document.getElementById('importBtn');if(b){b.disabled=false;b.textContent='Importar arquivos da loja'}}
  if(!loja||!ini||!fim){done();return box.innerHTML='<div class="alert a-bad">Informe loja e periodo.</div>'}
  if(!sel.length){done();return box.innerHTML='<div class="alert a-warn">Selecione arquivos ou pasta.</div>'}
  if(!fs.length){done();return box.innerHTML='<div class="alert a-bad">Nenhum .txt encontrado.</div>'}

  let atual=audit(loja),hasMonthly=false,allowed=monthsBetween(ini,fim),grouped={},hist=[],errors=[],warnings=[],totalR=0,lastPrev='';
  for(let f of fs){
    let p=parseTxt(await readText(f)),rt=detectType(f.name,tipo,p.head),cfg=TYPES[rt];
    if(!cfg){errors.push(f.name+': tipo nao identificado.');continue}
    if(!cfg.diario&&['Auditado','Aprovado'].includes(atual.status)&&!atual.reaberto){
      errors.push(f.name+': importacao mensal bloqueada porque '+loja+' ja esta '+atual.status.toLowerCase()+'. Retire a auditoria para reprocessar os 5 arquivos mensais.');
      continue
    }
    if(!cfg.diario)hasMonthly=true;
    lastPrev=p.preview;
    let miss=cfg.cols.filter(c=>!p.head.includes(c));
    if(miss.length){errors.push(f.name+' ('+cfg.label+'): colunas faltantes '+miss.join(', '));continue}
    let rows=p.rows.filter(r=>cfg.diario?inDatePeriod(r.data,ini,fim):allowed.includes(monthKey(r.mes))).map(r=>cfg.diario?({...r,data:dateKey(r.data),loja,__loja_vr:r.loja||'',__tipo:rt}):({...r,mes:monthKey(r.mes),loja,__loja_vr:r.loja||'',__tipo:rt}));
    if(!rows.length){warnings.push(f.name+': nenhuma linha no periodo. Nao sera importado (para evitar deletar dados sem adicionar).');continue}
    let key=rt+'|'+loja;(grouped[key]=grouped[key]||{tipo:rt,loja,rows:[]}).rows.push(...rows);
    totalR+=rows.length;
    hist.push({data:new Date().toLocaleString('pt-BR'),arquivo:f.name,loja,periodo:ini+' a '+fim,tipo:rt,linhas:rows.length,ignoradas:p.rows.length-rows.length,colunas_faltantes:[],observacao:obs})
  }

  let nb=document.getElementById('ir'),pv=document.getElementById('prev');
  if(pv&&lastPrev){pv.style.display='block';pv.textContent=lastPrev}
  let msg='';
  if(errors.length){
    msg=`<div class="alert a-bad"><b>Importacao cancelada.</b><br>${errors.join('<br>')}<br>Nenhum dado foi gravado para evitar lote parcial.</div>`
  }else{
    if(hasMonthly)delete db.aprovacoes[periodKey(loja)];
    Object.values(grouped).forEach(g=>{let b=TYPES[g.tipo].bucket,cfg=TYPES[g.tipo];db[b]=db[b].filter(r=>!(r.loja==g.loja&&r.__tipo==g.tipo&&(cfg.diario?inDatePeriod(r.data,ini,fim):allowed.includes(monthKey(r.mes))))).concat(g.rows)});
    if(hist.length)db.importacoes.unshift(...hist);
    try{
      await saveImportBatch({loja,ini,fim,hasMonthly,groups:Object.values(grouped),hist});
      fLoja.value=loja;setupFilters();fLoja.value=loja;
      msg=`<div class="alert a-ok"><b>Importacao concluida e salva na nuvem.</b> ${fs.length} arquivo(s), ${totalR} linhas. Loja: ${loja}</div>`
    }catch(e){
      msg=`<div class="alert a-bad"><b>Importacao ficou apenas neste navegador.</b><br>Nao foi possivel salvar na nuvem: ${e.message}</div>`
    }
  }
  if(warnings.length)msg+=`<div class="alert a-warn">${warnings.join('<br>')}</div>`;
  if(nb)nb.innerHTML=msg;
  done();
}
function template(){let t=(window.it&&it.value)||'resumo_geral_loja',b=new Blob([TYPES[t].cols.join(';')+'\n']),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=TYPES[t].file;a.click()}

/* ===== AUDITORIA ===== */
function audit(loja=fLoja.value){if(loja=='Todas')loja=db.empresas[0]?.nome||'Loja 01';let months=monthsBetween(fInicio.value,fFim.value),key=periodKey(loja),mark=db.aprovacoes[key]||{},imps=db.importacoes.filter(i=>i.loja==loja&&i.periodo==fInicio.value+' a '+fFim.value),present={};ORDER.forEach(t=>present[t]=db[TYPES[t].bucket].some(r=>r.loja==loja&&months.includes(monthKey(r.mes))&&r.__tipo==t));let missing=ORDER.filter(t=>!present[t]),t=total(loja,false),ignored=imps.reduce((s,i)=>s+(+i.ignoradas||0),0),alerts=[];if(missing.length)alerts.push('Faltam: '+missing.map(t=>TYPES[t].label).join(', '));if(!t.vt)alerts.push('Resumo geral sem venda no periodo.');if(ignored)alerts.push(num(ignored)+' linha(s) fora do periodo ignoradas na importacao (esperado quando o TXT cobre mais meses).');let st='Pendente';if(ORDER.length-missing.length>0)st=missing.length?'Parcial':'Auditado';if(st=='Auditado'&&!t.vt)st='Com erro';if(mark.status=='Reaberto'&&st=='Auditado')st='Reaberto';if(mark.status=='Aprovado')st='Aprovado';return{loja,months,imps,present,missing,total:t,ignored,alerts,status:st,reaberto:mark.status=='Reaberto',last:imps[0]?.data||'',obs:mark.obs||imps[0]?.observacao||''}}
function auditoria(){if(fLoja.value=='Todas')return'<div class="alert a-warn">Selecione uma loja especifica para auditar.</div>';let a=audit(),lock=['Auditado','Aprovado'].includes(a.status)&&!a.reaberto;return`<div class="grid kpis">${kpi('Status',statusPill(a.status),'',true)}${kpi('Arquivos',a.imps.length,'importados')}${kpi('Meses',a.months.length,'no periodo')}${kpi('Ignoradas',num(a.ignored),'linhas')}</div><div class="panel mt"><div class="panel-title">Controle do lote</div><div class="panel-sub">${lock?'Lote bloqueado para reimportacao. Retire a auditoria para corrigir arquivos.':'Lote liberado para ajustes e importacao.'}</div><div class="row mt">${lock?`<button class="btn" onclick="unlockAudit('${a.loja}',true)">Retirar auditoria</button>`:''}<button class="btn" onclick="go('importacoes')">Ir para importacao</button></div></div><div class="grid g2 mt"><div class="panel"><div class="panel-title">Historico</div>${history()}</div><div class="panel"><div class="panel-title">Diagnostico</div><p style="font-size:12px;margin-top:8px">Venda total: <b>${brl(a.total.vt)}</b></p><p style="font-size:12px">Campanhas: <b>${brl(a.total.v)}</b></p><p style="font-size:12px">Diferenca: <b>${brl(a.total.vt-a.total.v)}</b></p><div class="mt"><div class="panel-title">Arquivos faltantes</div><p style="margin-top:6px">${a.missing.map(t=>`<span class="pill p-warn">${TYPES[t].label}</span> `).join('')||'<span class="pill p-ok">Nenhum</span>'}</p></div>${a.alerts.map(x=>`<div class="alert a-warn">${x}</div>`).join('')||'<div class="alert a-ok">Sem alertas.</div>'}</div></div>`}

function plano(){let rs=db.empresas.filter(e=>fRegiao.value=='Todas'||e.regiao==fRegiao.value).map(e=>({...audit(e.nome),regiao:e.regiao})),tot=rs.length,ap=rs.filter(r=>r.status=='Aprovado').length,err=rs.filter(r=>r.status=='Com erro').length,pend=rs.filter(r=>!['Aprovado','Auditado'].includes(r.status)).length;return`<div class="grid kpis">${kpi('Total',tot,'lojas',true)}${kpi('Aprovadas',ap,pct(tot?ap/tot*100:0))}${kpi('Pendentes',pend,'')}${kpi('Com erro',err,'')}</div><div class="panel mt"><div class="panel-header"><div class="panel-title">Plano de Coleta</div>${csvBtn('CSV',"exportPlano()")}</div><div class="table-wrap"><table><thead><tr><th>Loja</th><th>Regiao</th><th>Status</th>${ORDER.map(t=>`<th>${TYPES[t].label.substring(0,6)}</th>`).join('')}<th>Ultima</th><th>Acoes</th></tr></thead><tbody>${rs.map(r=>{let lock=['Auditado','Aprovado'].includes(r.status)&&!r.reaberto;return`<tr><td><b>${r.loja}</b></td><td>${r.regiao}</td><td>${statusPill(r.status)}</td>${ORDER.map(t=>`<td>${r.present[t]?'<span class="pill p-ok">Sim</span>':'<span class="pill p-muted">Nao</span>'}</td>`).join('')}<td style="font-size:10px">${r.last||'-'}</td><td><button class="btn" onclick="openAudit('${r.loja}')">Ver auditoria</button> ${r.status!='Aprovado'?`<button class="btn primary" onclick="approve('${r.loja}')">Aprovar lote</button>`:''} ${lock?`<button class="btn" onclick="unlockAudit('${r.loja}',false)">Retirar auditoria</button>`:`<button class="btn" onclick="reprocess('${r.loja}')">Reprocessar</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`}

function openAudit(l){fLoja.value=l;go('auditoria')}
function saveAprovacoes(updates,cb){cacheLocal();if(location.protocol=='file:'){if(cb)cb(true);return}fetch('/api/aprovacoes',{method:'PATCH',headers:authHeaders(true),body:JSON.stringify({updates})}).then(async r=>{if(r.status===401){if(cb)cb(false);let t=prompt('Token de acesso da API:');if(t)setApiToken(t);return}if(!r.ok){let j=await r.json().catch(()=>({}));cloudError='HTTP '+r.status+': '+(j.error||'erro desconhecido');cloudOnline=false;updateCloud();if(cb)cb(false);return}cloudOnline=true;cloudError='';updateCloud();if(cb)cb(true)}).catch(e=>{cloudOnline=false;cloudError=e.message||'Falha de conexao';updateCloud();if(cb)cb(false)})}

function consolidacao(){let lojas=db.empresas.filter(e=>(fRegiao.value=='Todas'||e.regiao==fRegiao.value)&&audit(e.nome).status=='Aprovado'),data=[];if(fVisao.value=='mensal'){lojas.forEach(e=>monthsBetween(fInicio.value,fFim.value).forEach(m=>{let cs=db.campanhas.filter(r=>r.loja==e.nome&&monthKey(r.mes)==m).map(calc),rr=db.resumos.find(r=>r.loja==e.nome&&monthKey(r.mes)==m)||{},v=cs.reduce((s,r)=>s+r.venda,0),l=cs.reduce((s,r)=>s+r.lucro,0);data.push({loja:e.nome,mes:m,regiao:e.regiao,vt:+rr.venda_total||0,v,l,margem:v?l/v*100:0,part:rr.venda_total?v/rr.venda_total*100:0})}))}else{lojas.forEach(e=>{let t=total(e.nome,false);data.push({loja:e.nome,mes:'Acumulado',regiao:e.regiao,vt:t.vt,v:t.v,l:t.l,margem:t.margem,part:t.part})})}let html=`<div class="alert">Regra: apenas lojas aprovadas.</div><div class="panel mt"><div class="panel-header"><div class="panel-title">${fVisao.value=='mensal'?'Visao mensal':'Acumulado'}</div><div>${csvBtn('CSV',"exportConsol()")} <button class="btn" onclick="window.print()">Imprimir</button></div></div>${data.length?sortableTable('tCons',['Loja','Mes','Regiao','Venda total','Venda prom.','Part.','Lucro','Margem'],data.map(r=>[r.loja,r.mes,r.regiao,brl(r.vt),brl(r.v),pct(r.part),brl(r.l),pct(r.margem)]),['text','text','text','num','num','num','num','num']):'<p class="muted" style="text-align:center;padding:24px">Nenhuma loja aprovada.</p>'}</div>`;if(data.length>1){html+=`<div class="panel mt"><div class="panel-title">Comparativo entre lojas</div><div class="chart-xl"><canvas id="cConsol"></canvas></div></div>`;setTimeout(()=>{let u=[...new Set(data.map(r=>r.loja))];if(u.length)mkChart('cConsol','bar',u,[{label:'Venda prom.',data:u.map(l=>data.filter(r=>r.loja==l).reduce((s,r)=>s+r.v,0)),backgroundColor:PAL.green,borderRadius:4},{label:'Lucro',data:u.map(l=>data.filter(r=>r.loja==l).reduce((s,r)=>s+r.l,0)),backgroundColor:PAL.gold,borderRadius:4}],{plugins:{datalabels:{display:true,anchor:'end',align:'top',font:{size:10,weight:'700'},color:PAL.dark,formatter:v=>brlShort(v)},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+brl(ctx.raw)}}},scales:{y:{ticks:{callback:v=>brlShort(v)}}}})},120)}return html}
function exportConsol(){let lojas=db.empresas.filter(e=>(fRegiao.value=='Todas'||e.regiao==fRegiao.value)&&audit(e.nome).status=='Aprovado'),data=[];lojas.forEach(e=>{let t=total(e.nome,false);data.push({loja:e.nome,regiao:e.regiao,vt:t.vt,v:t.v,l:t.l,margem:t.margem,part:t.part})});exportCSV('consolidacao.csv',['Loja','Regiao','Venda Total','Venda Prom','Part','Lucro','Margem'],data.map(r=>[r.loja,r.regiao,r.vt.toFixed(2),r.v.toFixed(2),r.part.toFixed(2),r.l.toFixed(2),r.margem.toFixed(2)]))}

function modelos(){let loja=fLoja.value=='Todas'?'Loja 01':fLoja.value,tipo=(window.sqlTipo&&sqlTipo.value)||'resumo_geral_loja';return`<div class="panel"><div class="panel-title">Modelos SQL</div><div class="panel-sub">Consultas mensais de importacao e consultas diarias de apoio</div><div class="row mt"><select id="sqlTipo" onchange="render()">${SQL_ORDER.map(k=>`<option value="${k}" ${k==tipo?'selected':''}>${SQL_MODELS[k].label}</option>`).join('')}</select><button class="btn primary" onclick="copySql()">Copiar SQL</button></div><pre id="sqlBox" class="sql" style="margin-top:12px">${makeSql(tipo,empresa(loja),fInicio.value,fFim.value)}</pre></div>`}
function makeSql(tipo,e,ini,fim){let id=e.id_vr||1;if(tipo=='ofertas_dia_campanha')return`SELECT\n  v.id_loja AS loja,\n  v.data AS data,\n  i.id_tipooferta,\n  t.descricao AS campanha,\n  SUM(i.valortotal) AS venda_oferta,\n  SUM(i.customediocomimposto * i.quantidade) AS custo_oferta,\n  SUM(i.valortotal) - SUM(i.customediocomimposto * i.quantidade) AS lucro_oferta,\n  ROUND((SUM(i.valortotal) - SUM(i.customediocomimposto * i.quantidade)) / NULLIF(SUM(i.valortotal),0) * 100,2) AS margem_oferta,\n  SUM(i.quantidade) AS quantidade_oferta,\n  COUNT(DISTINCT v.id) AS cupons_oferta,\n  COUNT(DISTINCT i.id_produto) AS produtos_oferta\nFROM pdv.venda v\nINNER JOIN pdv.vendaitem i ON i.id_venda = v.id\nINNER JOIN public.tipooferta t ON t.id = i.id_tipooferta\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE AND i.oferta=TRUE\nGROUP BY v.id_loja, v.data, i.id_tipooferta, t.descricao\nORDER BY v.data, venda_oferta DESC;`;if(tipo=='venda_diaria_loja')return`SELECT\n  v.id_loja AS loja,\n  v.data AS data,\n  SUM(i.valortotal) AS venda_total,\n  SUM(i.customediocomimposto * i.quantidade) AS custo_total,\n  SUM(i.valortotal) - SUM(i.customediocomimposto * i.quantidade) AS lucro_total,\n  ROUND((SUM(i.valortotal) - SUM(i.customediocomimposto * i.quantidade)) / NULLIF(SUM(i.valortotal),0) * 100,2) AS margem_total,\n  COUNT(DISTINCT v.id) AS cupons_totais,\n  SUM(i.quantidade) AS unidades_totais\nFROM pdv.venda v\nINNER JOIN pdv.vendaitem i ON i.id_venda = v.id\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE\nGROUP BY v.id_loja, v.data\nORDER BY v.data;`;if(tipo=='cupons_totais')return`SELECT\n  v.id_loja AS loja,\n  TO_CHAR(DATE_TRUNC('month', v.data), 'YYYY-MM') AS mes,\n  ct.cupons_totais,\n  t.descricao AS campanha,\n  COUNT(DISTINCT v.id) AS cupons_campanha\nFROM pdv.vendaitem i\nINNER JOIN pdv.venda v ON v.id = i.id_venda\nINNER JOIN public.tipooferta t ON t.id = i.id_tipooferta\nINNER JOIN (\n  SELECT id_loja, DATE_TRUNC('month',data) AS mes_ref, COUNT(DISTINCT id) AS cupons_totais\n  FROM pdv.venda WHERE id_loja=${id} AND data>='${ini}' AND data<'${fim}' AND cancelado=FALSE\n  GROUP BY id_loja, DATE_TRUNC('month',data)\n) ct ON ct.id_loja=v.id_loja AND ct.mes_ref=DATE_TRUNC('month',v.data)\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE AND i.oferta=TRUE\nGROUP BY v.id_loja, DATE_TRUNC('month',v.data), ct.cupons_totais, t.descricao\nORDER BY mes, cupons_campanha DESC;`;if(tipo=='departamentos_campanha')return`SELECT\n  v.id_loja AS loja,\n  TO_CHAR(DATE_TRUNC('month', v.data), 'YYYY-MM') AS mes,\n  i.id_tipooferta, t.descricao AS campanha,\n  p.mercadologico1, m.descricao AS descricao_departamento,\n  COUNT(DISTINCT i.id_produto) AS produtos,\n  SUM(i.quantidade) AS quantidade,\n  SUM(i.valortotal) AS venda,\n  SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade) AS lucro,\n  ROUND((SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade))/NULLIF(SUM(i.valortotal),0)*100,2) AS margem\nFROM pdv.vendaitem i\nINNER JOIN pdv.venda v ON v.id=i.id_venda\nINNER JOIN public.tipooferta t ON t.id=i.id_tipooferta\nINNER JOIN public.produto p ON p.id=i.id_produto\nINNER JOIN public.mercadologico m ON m.mercadologico1=p.mercadologico1 AND m.nivel=1\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE AND i.oferta=TRUE\nGROUP BY v.id_loja, DATE_TRUNC('month',v.data), i.id_tipooferta, t.descricao, p.mercadologico1, m.descricao\nORDER BY mes, campanha, venda DESC;`;if(tipo=='produtos_campanha')return`SELECT\n  v.id_loja AS loja,\n  TO_CHAR(DATE_TRUNC('month', v.data), 'YYYY-MM') AS mes,\n  i.id_tipooferta, t.descricao AS campanha,\n  p.mercadologico1, m.descricao AS descricao_departamento,\n  i.id_produto, p.descricaocompleta AS descricao_produto,\n  SUM(i.quantidade) AS quantidade,\n  SUM(i.valortotal) AS venda,\n  SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade) AS lucro,\n  ROUND((SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade))/NULLIF(SUM(i.valortotal),0)*100,2) AS margem\nFROM pdv.vendaitem i\nINNER JOIN pdv.venda v ON v.id=i.id_venda\nINNER JOIN public.tipooferta t ON t.id=i.id_tipooferta\nINNER JOIN public.produto p ON p.id=i.id_produto\nINNER JOIN public.mercadologico m ON m.mercadologico1=p.mercadologico1 AND m.nivel=1\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE AND i.oferta=TRUE\nGROUP BY v.id_loja, DATE_TRUNC('month',v.data), i.id_tipooferta, t.descricao, p.mercadologico1, m.descricao, i.id_produto, p.descricaocompleta\nORDER BY mes, campanha, venda DESC;`;if(tipo=='campanhas_ofertas')return`SELECT\n  v.id_loja AS loja,\n  TO_CHAR(DATE_TRUNC('month', v.data), 'YYYY-MM') AS mes,\n  i.id_tipooferta, t.descricao,\n  SUM(i.valortotal) AS venda,\n  SUM(i.customediocomimposto*i.quantidade) AS custo,\n  SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade) AS lucro,\n  ROUND((SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade))/NULLIF(SUM(i.valortotal),0)*100,2) AS margem,\n  SUM(i.quantidade) AS quantidade,\n  COUNT(*) AS itens,\n  COUNT(DISTINCT i.id_produto) AS produtos_distintos,\n  COUNT(DISTINCT v.id) AS cupons,\n  ROUND(SUM(i.valortotal)/NULLIF(COUNT(DISTINCT v.id),0),2) AS ticket_medio,\n  ROUND(SUM(i.valortotal)/NULLIF(SUM(i.quantidade),0),2) AS preco_medio\nFROM pdv.venda v\nINNER JOIN pdv.vendaitem i ON i.id_venda=v.id\nINNER JOIN public.tipooferta t ON t.id=i.id_tipooferta\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE AND i.oferta=TRUE\nGROUP BY v.id_loja, DATE_TRUNC('month',v.data), i.id_tipooferta, t.descricao\nORDER BY mes, venda DESC;`;return`SELECT\n  v.id_loja AS loja,\n  TO_CHAR(DATE_TRUNC('month', v.data), 'YYYY-MM') AS mes,\n  SUM(i.valortotal) AS venda_total,\n  SUM(i.customediocomimposto*i.quantidade) AS custo_total,\n  SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade) AS lucro_total,\n  ROUND((SUM(i.valortotal)-SUM(i.customediocomimposto*i.quantidade))/NULLIF(SUM(i.valortotal),0)*100,2) AS margem_total,\n  COUNT(DISTINCT v.id) AS cupons_totais,\n  SUM(i.quantidade) AS unidades_totais,\n  COUNT(DISTINCT i.id_produto) AS produtos_distintos\nFROM pdv.venda v\nINNER JOIN pdv.vendaitem i ON i.id_venda=v.id\nWHERE v.id_loja=${id} AND v.data>='${ini}' AND v.data<'${fim}' AND v.cancelado=FALSE\nGROUP BY v.id_loja, DATE_TRUNC('month',v.data)\nORDER BY mes;`}

/* ===== ENCARTE BIG NORDESTE ===== */
function encarteAnalise(){
  let isEncNome=r=>ofertaKey(r.campanha||'').includes('ENCARTE BIG NORDESTE');
  let isWin=dt=>{let day=+dateKey(dt).slice(8,10);return day<=5||day>=25};
  let fReg=fRegiao.value,encLD=new Set(),encSales={};
  db.ofertasDia.forEach(r=>{
    if(!isEncNome(r)||!isWin(r.data)||!inDatePeriod(r.data,fInicio.value,fFim.value)||!storeAllowed(r.loja)||(fReg!='Todas'&&empresa(r.loja).regiao!=fReg))return;
    let k=r.loja+'|'+dateKey(r.data);encLD.add(k);
    if(!encSales[k])encSales[k]={v:0,l:0,c:0,p:0};
    let e=encSales[k];e.v+=+r.venda_oferta||0;e.l+=+r.lucro_oferta||0;e.c+=+r.cupons_oferta||0;e.p+=+r.produtos_oferta||0;
  });
  let recs=[];
  db.vendasDiarias.forEach(r=>{
    let dt=dateKey(r.data),loja=r.loja;
    if(!inDatePeriod(r.data,fInicio.value,fFim.value)||!storeAllowed(loja)||(fReg!='Todas'&&empresa(loja).regiao!=fReg))return;
    let k=loja+'|'+dt,dd=new Date(dt+'T00:00:00'),dow=dd.getDay(),day=dd.getDate(),month=dt.slice(0,7);
    let vt=+r.venda_total||0,lt=+r.lucro_total||0,ct=+r.cupons_totais||0,ut=+r.unidades_totais||0;
    recs.push({loja,dt,k,dow,day,month,hasEnc:encLD.has(k),inWin:day<=5||day>=25,vt,lt,ct,ut,ticket:ct?vt/ct:0,marg:vt?lt/vt*100:0});
  });
  let groups={};
  recs.forEach(r=>{let gk=r.loja+'|'+r.month+'|'+r.dow;(groups[gk]=groups[gk]||[]).push(r)});
  let pairs=[];
  Object.values(groups).forEach(gdays=>{
    let enc=gdays.filter(r=>r.hasEnc),ctrl=gdays.filter(r=>!r.hasEnc&&!r.inWin);
    if(!enc.length||!ctrl.length)return;
    let ca={vt:0,lt:0,ct:0,ut:0,ticket:0,marg:0,n:ctrl.length};
    ctrl.forEach(r=>{ca.vt+=r.vt/ctrl.length;ca.lt+=r.lt/ctrl.length;ca.ct+=r.ct/ctrl.length;ca.ut+=r.ut/ctrl.length;ca.ticket+=r.ticket/ctrl.length;ca.marg+=r.marg/ctrl.length});
    enc.forEach(r=>pairs.push({r,c:ca}));
  });
  if(!pairs.length)return'<div class="panel"><div class="panel-title">Sem dados</div><div class="panel-sub">Importe ofertasDia e vendasDiarias para ver a analise do encarte.</div></div>';
  let N=pairs.length;
  let aE={vt:0,lt:0,ct:0,ut:0},aC={vt:0,lt:0,ct:0,ut:0};
  pairs.forEach(({r,c})=>{aE.vt+=r.vt;aE.lt+=r.lt;aE.ct+=r.ct;aE.ut+=r.ut;aC.vt+=c.vt;aC.lt+=c.lt;aC.ct+=c.ct;aC.ut+=c.ut});
  let liftV=aC.vt?(aE.vt/aC.vt-1)*100:0,liftL=aC.lt?(aE.lt/aC.lt-1)*100:0,liftC=aC.ct?(aE.ct/aC.ct-1)*100:0;
  let tickE=aE.ct?aE.vt/aE.ct:0,tickC=aC.ct?aC.vt/aC.ct:0,liftT=tickC?(tickE/tickC-1)*100:0;
  let margE=aE.vt?aE.lt/aE.vt*100:0,margC=aC.vt?aC.lt/aC.vt*100:0;
  let itensE=aE.ct?aE.ut/aE.ct:0,itensC=aC.ct?aC.ut/aC.ct:0;
  let totEncV=0,totEncL=0;pairs.forEach(({r})=>{let es=encSales[r.k];if(es){totEncV+=es.v;totEncL+=es.l}});
  let encMarg=totEncV?totEncL/totEncV*100:0;
  let lucInc=aE.lt-aC.lt,vdaInc=aE.vt-aC.vt;
  let custoMarg=totEncV*margC/100-totEncL;
  let saldo=lucInc-custoMarg;
  let naoEncV=aE.vt-totEncV,ctrlTotalV=aC.vt;
  let canib=ctrlTotalV?(naoEncV/ctrlTotalV-1)*100:0;
  // Per-store
  let ld={};
  pairs.forEach(({r,c})=>{if(!ld[r.loja])ld[r.loja]={ps:[],eV:0,eL:0};let d=ld[r.loja];d.ps.push({r,c});let es=encSales[r.k];if(es){d.eV+=es.v;d.eL+=es.l}});
  let fatL={};db.resumos.forEach(r=>{if(inPeriod(r.mes))fatL[r.loja]=(fatL[r.loja]||0)+(+r.venda_total||0)});
  let storeRows=Object.entries(ld).map(([loja,d])=>{
    let pp=d.ps,n=pp.length;
    let sVe=pp.reduce((s,p)=>s+p.r.vt,0),sVc=pp.reduce((s,p)=>s+p.c.vt,0);
    let sLe=pp.reduce((s,p)=>s+p.r.lt,0),sLc=pp.reduce((s,p)=>s+p.c.lt,0);
    let sCe=pp.reduce((s,p)=>s+p.r.ct,0),sCc=pp.reduce((s,p)=>s+p.c.ct,0);
    let sUe=pp.reduce((s,p)=>s+p.r.ut,0),sUc=pp.reduce((s,p)=>s+p.c.ut,0);
    let lv=sVc?(sVe/sVc-1)*100:0,ll=sLc?(sLe/sLc-1)*100:0,lc=sCc?(sCe/sCc-1)*100:0;
    let te=sCe?sVe/sCe:0,tc=sCc?sVc/sCc:0,lt=tc?(te/tc-1)*100:0;
    let me=sVe?sLe/sVe*100:0,mc=sVc?sLc/sVc*100:0;
    let ie=sCe?sUe/sCe:0,ic=sCc?sUc/sCc:0;
    let eV=d.eV,eL=d.eL,eMarg=eV?eL/eV*100:0;
    let pen=sCe?pp.reduce((s,p)=>{let es=encSales[p.r.k];return s+(es?es.c:0)},0)/sCe*100:0;
    let vInc=sVe-sVc,lInc=sLe-sLc;
    let cMarg=eV*mc/100-eL;
    let sal=lInc-cMarg;

  if(!pages.some(([id])=>id==page))page=pages[0][0];
  document.querySelector('header .filters').style.display=page=='benchmark'?'none':'';
  let pd=document.getElementById('printDate');if(pd)pd.textContent=new Date().toLocaleString('pt-BR');
  let ap=db.empresas.filter(e=>(fRegiao.value=='Todas'||e.regiao==fRegiao.value)&&audit(e.nome).status=='Aprovado').length;
  nav.innerHTML=pages.map(([id,l])=>`<button class="${id==page?'active':''}" onclick="go('${id}')">${ICONS[id]||''}${l}${id=='plano'?'<span class="nav-badge">'+ap+'/27</span>':''}</button>`).join('');
  let meta={decisao:['Centro de Decisao','Diagnostico e plano de acao'],dashboard:['Dashboard','Visao geral do periodo'],encarte:['Encarte Big Nordeste','Analise por loja — fluxo, ticket, canibalizacao e eficiencia'],benchmark:['Benchmark de Encartes','Comparacao funcional de preco, variedade e atratividade'],periodo:['Periodo de Campanha','Analise diaria e comparativo justo'],importacoes:['Importacoes','Importar arquivos .txt'],auditoria:['Auditoria','Validar periodo'],plano:['Plano de Coleta','Controle de '+db.empresas.length+' lojas'],modelos:['Modelos SQL','Consultas VR'],empresas:['Empresas','Cadastro'],consolidacao:['Consolidacao','Lojas aprovadas'],relatorio:['Relatorio','Resumo'],backups:['Seguranca e Backups','Protecao e restauracao da base']}[page];
  title.textContent=meta[0];sub.textContent=meta[1];
  let vis={decisao:['fLoja','fRegiao','fInicio','fFim','fReset','fCamp'],dashboard:['fLoja','fRegiao','fInicio','fFim','fReset','fCamp'],encarte:['fLoja','fRegiao','fInicio','fFim','fReset'],periodo:['fLoja','fRegiao','fInicio','fFim','fReset','fCamp'],importacoes:['fInicio','fFim','fReset'],auditoria:['fLoja','fInicio','fFim','fReset'],plano:['fRegiao','fInicio','fFim','fReset'],modelos:['fLoja','fInicio','fFim','fReset'],empresas:[],consolidacao:['fRegiao','fInicio','fFim','fReset','fVisao'],relatorio:['fLoja','fInicio','fFim','fReset'],backups:[]}[page]||[];
  ['fLoja','fRegiao','fInicio','fFim','fReset','fVisao','fCamp'].forEach(id=>document.getElementById(id).style.display=vis.includes(id)?'':'none');
  view.classList.add('fade');
  setTimeout(()=>{view.innerHTML=securityWarning()+cloudWarning()+approvalWarning()+({decisao,dashboard,encarte:encarteAnalise,benchmark,periodo:periodoCampanha,importacoes,auditoria,plano,modelos,empresas,consolidacao,relatorio,backups})[page]();view.classList.remove('fade');if(page=='importacoes')showReq()},80);
}
['fLoja','fRegiao','fInicio','fFim','fVisao','fCamp'].forEach(id=>document.getElementById(id).addEventListener('change',render));
setupFilters();render();loadCloud();checkHealth();
</script>
